name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The hosted runner has Docker, so Testcontainers starts PostgreSQL and Redis. No services block is needed.
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Domain tests
        run: npm run test:domain
      - name: Persistence tests
        run: npm run test:persistence
      - name: API tests
        run: npm run test:api
