# PostgreSQL for a local run of the service, `npm run migrate` and `npm run seed`.
# Tests do not use this file: they start their own containers (ADR-0026).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sports
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
